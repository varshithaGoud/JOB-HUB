<!DOCTYPE html>
<html>
<head>
<title>Job Details - JobHub</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="jobs.html">JobHub</a><a class="btn btn-light" href="jobs.html">All Jobs</a></div></nav>
<div class="container mt-5"><div id="job" class="card shadow p-4">Loading job details...</div></div>
<script>
const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://localhost:8080/api" : "https://jobhub-backend.onrender.com/api";
const id=new URLSearchParams(location.search).get("id");
fetch(API_BASE+"/jobs/"+id).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>job.innerHTML=`<h2>${esc(j.title)}</h2><h5 class="text-primary">${esc(j.company)}</h5><hr>
<p><b>Location:</b> ${esc(j.location)}</p><p><b>Salary:</b> ${esc(j.salary)}</p><p><b>Job Type:</b> ${esc(j.jobType)}</p><p><b>Description:</b></p><p>${esc(j.description||"")}</p><hr>
<button class="btn btn-success" onclick="applyJob()">Apply Now</button> <a href="jobs.html" class="btn btn-secondary">Back to Jobs</a>`).catch(()=>job.innerHTML='<p class="text-danger">Unable to load job details.</p>');
function applyJob(){const uid=localStorage.getItem("userId");if(!uid){alert("Please login first!");location.href="login.html";return}
const appObj={id:Date.now(),jobId:Number(id),userId:Number(uid),status:"PENDING",appliedDate:new Date().toISOString().split('T')[0]};
const localApps=JSON.parse(localStorage.getItem("local_applications")||"[]");
const idx=localApps.findIndex(a=>a.jobId==appObj.jobId&&a.userId==appObj.userId);
if(idx>=0)localApps[idx]={...localApps[idx],...appObj};else localApps.push(appObj);
localStorage.setItem("local_applications",JSON.stringify(localApps));
fetch(API_BASE+"/applications",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jobId:Number(id),userId:Number(uid)})})
.then(()=>{alert("Application submitted successfully!");location.href="my-applications.html"}).catch(()=>{alert("Application submitted successfully!");location.href="my-applications.html"})}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script></body></html>
