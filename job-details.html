<!DOCTYPE html>
<html>
<head>
<title>Job Details - JobHub</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light"><nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="jobs.html">JobHub</a><a class="btn btn-light" href="jobs.html">All Jobs</a></div></nav>
<div class="container mt-5"><div id="job" class="card shadow p-4">Loading job details...</div></div>
<script>
const id=new URLSearchParams(location.search).get("id");
fetch("http://localhost:8080/api/jobs/"+id).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>job.innerHTML=`<h2>${esc(j.title)}</h2><h5 class="text-primary">${esc(j.company)}</h5><hr>
<p><b>Location:</b> ${esc(j.location)}</p><p><b>Salary:</b> ${esc(j.salary)}</p><p><b>Job Type:</b> ${esc(j.jobType)}</p><p><b>Description:</b></p><p>${esc(j.description||"")}</p><hr>
<button class="btn btn-success" onclick="applyJob()">Apply Now</button> <a href="jobs.html" class="btn btn-secondary">Back to Jobs</a>`).catch(()=>job.innerHTML='<p class="text-danger">Unable to load job details.</p>');
function applyJob(){const uid=localStorage.getItem("userId");if(!uid){alert("Please login first!");location.href="login.html";return}
fetch("http://localhost:8080/api/applications",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jobId:Number(id),userId:Number(uid)})})
.then(async r=>{const d=await r.json();if(!r.ok)throw Error(typeof d==="string"?d:"Failed to apply");alert("Application submitted successfully!");location.href="my-applications.html"}).catch(e=>alert(e.message||"Failed to apply!"))}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script></body></html>
