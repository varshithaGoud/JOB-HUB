<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - JobHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <!-- Glass Navbar -->
    <nav class="navbar navbar-expand-lg glass-nav">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <div class="company-avatar" style="width: 38px; height: 38px; font-size: 1.1rem;">
                    <i class="fas fa-briefcase"></i>
                </div>
                <span class="fs-4 fw-bold text-white">Job<span style="color: var(--primary);">Hub</span></span>
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="index.html" class="btn btn-glass btn-sm"><i class="fas fa-search me-1"></i> Browse Jobs</a>
                <button onclick="logout()" class="btn btn-glass btn-sm"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>
    </nav>

    <!-- Header Banner -->
    <div class="container py-4">
        <div class="glass-card p-4 mb-4">
            <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
                <div class="d-flex align-items-center gap-3">
                    <div class="company-avatar" id="candidateAvatar" style="width: 56px; height: 56px; font-size: 1.5rem;">A</div>
                    <div>
                        <h3 class="text-white mb-0" id="candidateName">My Application Dashboard</h3>
                        <span class="text-secondary small" id="candidateEmail">Track status & updates on your submitted job applications</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Metrics Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="glass-card p-3 text-center">
                    <span class="text-secondary small font-semibold">Total Submitted</span>
                    <h2 class="text-white fw-bold mb-0" id="cntTotal">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card p-3 text-center">
                    <span class="text-warning small font-semibold">Pending / Reviewing</span>
                    <h2 class="text-warning fw-bold mb-0" id="cntPending">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card p-3 text-center">
                    <span class="text-emerald small font-semibold" style="color: #34d399;">Accepted Offers</span>
                    <h2 class="text-success fw-bold mb-0" id="cntAccepted">0</h2>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card p-3 text-center">
                    <span class="text-rose small font-semibold" style="color: #fda4af;">Declined</span>
                    <h2 class="text-danger fw-bold mb-0" id="cntRejected">0</h2>
                </div>
            </div>
        </div>

        <!-- Applications List -->
        <h4 class="text-white mb-3"><i class="fas fa-tasks text-primary me-2"></i>Application History</h4>
        <div id="applicationsContainer" class="d-flex flex-column gap-3">
            <div class="text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p class="text-secondary mt-2">Loading applications...</p>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core JobHub Store -->
    <script src="script.js"></script>

    <script>
        const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
            ? "http://localhost:8080/api"
            : "https://jobhub-backend.onrender.com/api";
        const userId = localStorage.getItem("userId");

        document.addEventListener("DOMContentLoaded", () => {
            if (!userId) {
                alert("Please login to view your applications.");
                window.location.href = "login.html";
                return;
            }

            document.getElementById("candidateName").innerText = localStorage.getItem("userName") || "Candidate Dashboard";
            document.getElementById("candidateEmail").innerText = localStorage.getItem("userEmail") || "Job Seeker";
            document.getElementById("candidateAvatar").innerText = (localStorage.getItem("userName") || 'A').charAt(0).toUpperCase();

            loadApplications();
        });

        function renderApplicationCards(apps) {
            updateCounts(apps);

            if (!apps || apps.length === 0) {
                document.getElementById("applicationsContainer").innerHTML = `
                    <div class="glass-card p-5 text-center">
                        <i class="fas fa-file-invoice text-secondary fa-3x mb-3"></i>
                        <h5 class="text-white">No Applications Yet</h5>
                        <p class="text-secondary small mb-3">You haven't submitted any job applications yet.</p>
                        <a href="index.html" class="btn btn-primary-gradient"><i class="fas fa-search me-1"></i> Explore Jobs</a>
                    </div>
                `;
                return;
            }

            let html = "";
            apps.forEach(app => {
                const job = (window.JobHubStore && JobHubStore.getJobById(app.jobId)) || {
                    title: "Position #" + app.jobId,
                    company: "Company",
                    location: "Remote",
                    salary: "Competitive"
                };

                let badgeHtml = "";
                const st = (app.status || "PENDING").toUpperCase();
                if (st === "ACCEPTED") {
                    badgeHtml = `<span class="badge-custom badge-accepted"><i class="fas fa-check-circle me-1"></i> Accepted / Offer</span>`;
                } else if (st === "REJECTED") {
                    badgeHtml = `<span class="badge-custom badge-rejected"><i class="fas fa-times-circle me-1"></i> Declined</span>`;
                } else if (st === "UNDER_REVIEW") {
                    badgeHtml = `<span class="badge-custom badge-reviewing"><i class="fas fa-search me-1"></i> Under Review</span>`;
                } else {
                    badgeHtml = `<span class="badge-custom badge-pending"><i class="fas fa-hourglass-half me-1"></i> Pending</span>`;
                }

                html += `
                    <div class="glass-card p-4 animate-fade-in">
                        <div class="row align-items-center g-3">
                            <div class="col-md-7">
                                <div class="d-flex align-items-center gap-3 mb-2">
                                    <div class="company-avatar" style="width: 44px; height: 44px;">
                                        ${job.company ? job.company.charAt(0).toUpperCase() : 'J'}
                                    </div>
                                    <div>
                                        <h5 class="text-white mb-0 fw-bold">${job.title}</h5>
                                        <span class="text-primary fw-semibold small">${job.company}</span>
                                        <span class="text-secondary small ms-2"><i class="fas fa-map-marker-alt me-1 text-danger"></i>${job.location}</span>
                                    </div>
                                </div>
                                ${app.coverLetter ? `<p class="text-secondary small mt-2 mb-0 bg-dark p-2 rounded border border-secondary" style="font-style: italic;">"${app.coverLetter}"</p>` : ''}
                            </div>

                            <div class="col-md-5 d-flex flex-column align-items-md-end justify-content-between gap-2">
                                <div>${badgeHtml}</div>
                                <span class="text-muted small"><i class="far fa-calendar-alt me-1"></i>Applied: ${app.appliedDate || 'Recently'}</span>
                                <button onclick="cancelApp(${app.id})" class="btn btn-outline-danger btn-sm px-3 mt-1">
                                    <i class="fas fa-trash-alt me-1"></i> Cancel Application
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById("applicationsContainer").innerHTML = html;
        }

        function loadApplications() {
            // Immediately render from local JobHubStore so it NEVER shows 0 or spins forever!
            if (window.JobHubStore) {
                const localApps = JobHubStore.getUserApplications(userId);
                renderApplicationCards(localApps);
            }

            const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
            const timeoutId = controller ? setTimeout(() => controller.abort(), 3500) : null;

            fetch(`${API_BASE}/applications/user/${userId}`, { signal: controller ? controller.signal : null })
                .then(res => {
                    if (timeoutId) clearTimeout(timeoutId);
                    if (!res.ok) throw new Error("HTTP error " + res.status);
                    return res.json();
                })
                .then(async apps => {
                    if (Array.isArray(apps) && apps.length > 0) {
                        apps.forEach(a => { if (window.JobHubStore) JobHubStore.saveApplication(a); });
                        renderApplicationCards(JobHubStore.getUserApplications(userId));
                    }
                })
                .catch(err => {
                    if (timeoutId) clearTimeout(timeoutId);
                    console.warn("Using offline applications fallback:", err);
                    if (window.JobHubStore) {
                        renderApplicationCards(JobHubStore.getUserApplications(userId));
                    }
                });
        }

        function updateCounts(apps) {
            const list = apps || [];
            document.getElementById("cntTotal").innerText = list.length;
            let pending = 0, accepted = 0, rejected = 0;
            list.forEach(a => {
                const s = (a.status || "PENDING").toUpperCase();
                if (s === "ACCEPTED") accepted++;
                else if (s === "REJECTED") rejected++;
                else pending++;
            });
            document.getElementById("cntPending").innerText = pending;
            document.getElementById("cntAccepted").innerText = accepted;
            document.getElementById("cntRejected").innerText = rejected;
        }

        function cancelApp(id) {
            if (!confirm("Are you sure you want to cancel this application?")) return;

            if (window.JobHubStore) {
                JobHubStore.deleteApplication(id);
            }

            fetch(`${API_BASE}/applications/${id}`, { method: "DELETE" }).catch(() => {});
            alert("Application cancelled.");
            loadApplications();
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
