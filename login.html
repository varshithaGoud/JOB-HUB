<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register - JobHub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-between">

    <!-- Header -->
    <nav class="navbar glass-nav">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
                <div class="company-avatar" style="width: 36px; height: 36px; font-size: 1rem;">
                    <i class="fas fa-briefcase"></i>
                </div>
                <span class="fs-4 fw-bold text-white">Job<span style="color: var(--primary);">Hub</span></span>
            </a>
            <a href="index.html" class="btn btn-glass btn-sm"><i class="fas fa-arrow-left me-1"></i> Back to Jobs</a>
        </div>
    </nav>

    <!-- Main Auth Card -->
    <div class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                
                <!-- Demo Login Box -->
                <div class="glass-card p-3 mb-4 text-center">
                    <span class="text-secondary small font-bold uppercase tracking-wider d-block mb-2">
                        <i class="fas fa-bolt text-warning me-1"></i> Quick One-Click Demo Access
                    </span>
                    <div class="d-flex flex-wrap gap-2 justify-content-center">
                        <button onclick="fillDemo('alex@seeker.com', 'seeker123')" class="btn btn-glass btn-sm" style="font-size: 0.75rem;">
                            <i class="fas fa-user text-info me-1"></i> Candidate Demo
                        </button>
                        <button onclick="fillDemo('techcorp@jobs.com', 'recruiter123')" class="btn btn-glass btn-sm" style="font-size: 0.75rem;">
                            <i class="fas fa-building text-warning me-1"></i> Recruiter Demo
                        </button>
                        <button onclick="fillDemo('admin@jobhub.com', 'admin123')" class="btn btn-glass btn-sm" style="font-size: 0.75rem;">
                            <i class="fas fa-user-shield text-danger me-1"></i> Admin Demo
                        </button>
                    </div>
                </div>

                <div class="glass-card p-4 p-md-5">
                    <!-- Nav Tabs -->
                    <ul class="nav nav-pills nav-justified mb-4 p-1 glass-card" style="border-radius: var(--radius-sm);">
                        <li class="nav-item">
                            <button class="nav-link text-white fw-bold active" id="tabLoginBtn" onclick="switchTab('login')">Sign In</button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link text-secondary fw-bold" id="tabRegisterBtn" onclick="switchTab('register')">Create Account</button>
                        </li>
                    </ul>

                    <!-- LOGIN FORM -->
                    <form id="loginForm" onsubmit="handleLogin(event)">
                        <h4 class="text-white text-center mb-1 fw-bold">Welcome Back</h4>
                        <p class="text-secondary text-center small mb-4">Sign in to access your dashboard</p>

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text border-0 bg-transparent text-secondary"><i class="fas fa-envelope"></i></span>
                                <input type="email" id="loginEmail" class="form-control form-control-custom ps-0" placeholder="name@domain.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary small">Password</label>
                            <div class="input-group">
                                <span class="input-group-text border-0 bg-transparent text-secondary"><i class="fas fa-lock"></i></span>
                                <input type="password" id="loginPassword" class="form-control form-control-custom ps-0" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary-gradient w-100 py-2.5 mb-3">
                            <i class="fas fa-sign-in-alt me-1"></i> Sign In to Account
                        </button>

                        <p id="loginMessage" class="text-center small mb-0"></p>
                    </form>

                    <!-- REGISTER FORM -->
                    <form id="registerForm" onsubmit="handleRegister(event)" style="display: none;">
                        <h4 class="text-white text-center mb-1 fw-bold">Join JobHub</h4>
                        <p class="text-secondary text-center small mb-4">Create your account to start applying or posting jobs</p>

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Full Name / Organization</label>
                            <input type="text" id="regName" class="form-control form-control-custom" placeholder="Alex Johnson or TechCorp" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Email Address</label>
                            <input type="email" id="regEmail" class="form-control form-control-custom" placeholder="name@domain.com" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Password</label>
                            <input type="password" id="regPassword" class="form-control form-control-custom" placeholder="Minimum 6 characters" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-secondary small">I am a:</label>
                            <select id="regRole" class="form-control form-control-custom form-select">
                                <option value="JOB_SEEKER">🧑‍💻 Job Seeker (Apply for Jobs)</option>
                                <option value="RECRUITER">🏢 Recruiter (Post Jobs & Review Applicants)</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary-gradient w-100 py-2.5 mb-3">
                            <i class="fas fa-user-plus me-1"></i> Complete Registration
                        </button>

                        <p id="registerMessage" class="text-center small mb-0"></p>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="py-3 text-center text-secondary small border-top border-secondary">
        &copy; 2026 JobHub Platform. All rights reserved.
    </footer>

    <script>
        const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
            ? "http://localhost:8080/api"
            : "https://jobhub-backend.onrender.com/api";

        function switchTab(tab) {
            const loginForm = document.getElementById("loginForm");
            const registerForm = document.getElementById("registerForm");
            const tabLoginBtn = document.getElementById("tabLoginBtn");
            const tabRegisterBtn = document.getElementById("tabRegisterBtn");

            if (tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLoginBtn.classList.add('active', 'text-white');
                tabLoginBtn.classList.remove('text-secondary');
                tabRegisterBtn.classList.remove('active', 'text-white');
                tabRegisterBtn.classList.add('text-secondary');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabRegisterBtn.classList.add('active', 'text-white');
                tabRegisterBtn.classList.remove('text-secondary');
                tabLoginBtn.classList.remove('active', 'text-white');
                tabLoginBtn.classList.add('text-secondary');
            }
        }

        function fillDemo(email, password) {
            document.getElementById("loginEmail").value = email;
            document.getElementById("loginPassword").value = password;
            switchTab('login');
        }

        const DEMO_ACCOUNTS = {
            "admin@jobhub.com": { id: 1, name: "System Administrator", email: "admin@jobhub.com", role: "ADMIN", password: "password" },
            "techcorp@jobs.com": { id: 2, name: "Sarah Jenkins", email: "techcorp@jobs.com", role: "RECRUITER", password: "password" },
            "nextgen@jobs.com": { id: 3, name: "Marcus Vance", email: "nextgen@jobs.com", role: "RECRUITER", password: "password" },
            "alex@seeker.com": { id: 4, name: "Alex Johnson", email: "alex@seeker.com", role: "JOB_SEEKER", password: "password" },
            "elena@seeker.com": { id: 5, name: "Elena Rostova", email: "elena@seeker.com", role: "JOB_SEEKER", password: "password" }
        };

        window.addEventListener("DOMContentLoaded", () => {
            if (window.location.hash === "#register") {
                switchTab('register');
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim().toLowerCase();
            const password = document.getElementById("loginPassword").value;
            const msg = document.getElementById("loginMessage");

            msg.innerHTML = `<span class="text-info"><i class="fas fa-spinner fa-spin me-1"></i> Authenticating...</span>`;

            const localUsers = JSON.parse(localStorage.getItem("registered_users") || "{}");
            const matchedLocalUser = localUsers[email];

            const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
            const timeoutId = controller ? setTimeout(() => controller.abort(), 3500) : null;

            fetch(`${API_BASE}/users/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
                signal: controller ? controller.signal : null
            })
            .then(async res => {
                if (timeoutId) clearTimeout(timeoutId);
                const text = await res.text();
                let data;
                try { data = JSON.parse(text); } catch { data = text; }
                if (!res.ok) throw new Error(typeof data === 'object' && data.message ? data.message : (typeof data === 'string' ? data : "Invalid credentials"));
                return data;
            })
            .then(user => {
                proceedLogin(user);
            })
            .catch(err => {
                if (timeoutId) clearTimeout(timeoutId);
                if (matchedLocalUser && (!matchedLocalUser.password || matchedLocalUser.password === password)) {
                    console.warn("Backend server unreachable. Using local registered user credentials.");
                    proceedLogin(matchedLocalUser);
                } else if (DEMO_ACCOUNTS[email]) {
                    console.warn("Backend server unreachable/slow. Using demo credentials fallback.");
                    proceedLogin(DEMO_ACCOUNTS[email]);
                } else {
                    msg.innerHTML = `<span class="text-danger"><i class="fas fa-exclamation-circle me-1"></i> ${err.message || "Login failed."}</span>`;
                }
            });
        }

        function proceedLogin(user) {
            const msg = document.getElementById("loginMessage");
            localStorage.setItem("userId", user.id);
            localStorage.setItem("userName", user.name);
            localStorage.setItem("userEmail", user.email);
            localStorage.setItem("userRole", user.role);

            msg.innerHTML = `<span class="text-success"><i class="fas fa-check-circle me-1"></i> Success! Redirecting...</span>`;

            setTimeout(() => {
                if (user.role === "RECRUITER") {
                    window.location.href = "recruiter-dashboard.html";
                } else if (user.role === "ADMIN") {
                    window.location.href = "admin-dashboard.html";
                } else {
                    window.location.href = "index.html";
                }
            }, 500);
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim().toLowerCase();
            const password = document.getElementById("regPassword").value;
            const role = document.getElementById("regRole").value;
            const msg = document.getElementById("registerMessage");

            if (!name || !email || !password) {
                msg.innerHTML = `<span class="text-danger"><i class="fas fa-exclamation-circle me-1"></i> Please fill in all fields.</span>`;
                return;
            }

            const user = { name, email, password, role };

            msg.innerHTML = `<span class="text-info"><i class="fas fa-spinner fa-spin me-1"></i> Creating account...</span>`;

            const saveLocalAndProceed = (userData) => {
                const localUsers = JSON.parse(localStorage.getItem("registered_users") || "{}");
                localUsers[email] = {
                    id: userData.id || Date.now(),
                    name: userData.name || name,
                    email: email,
                    role: userData.role || role || "JOB_SEEKER",
                    password: password
                };
                localStorage.setItem("registered_users", JSON.stringify(localUsers));

                msg.innerHTML = `<span class="text-success"><i class="fas fa-check-circle me-1"></i> Account created! Logging you in...</span>`;
                localStorage.setItem("userId", userData.id || Date.now());
                localStorage.setItem("userName", userData.name || name);
                localStorage.setItem("userEmail", email);
                localStorage.setItem("userRole", userData.role || role || "JOB_SEEKER");

                setTimeout(() => {
                    if ((userData.role || role) === "RECRUITER") {
                        window.location.href = "recruiter-dashboard.html";
                    } else if ((userData.role || role) === "ADMIN") {
                        window.location.href = "admin-dashboard.html";
                    } else {
                        window.location.href = "index.html";
                    }
                }, 800);
            };

            const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
            const timeoutId = controller ? setTimeout(() => controller.abort(), 3500) : null;

            fetch(`${API_BASE}/users/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(user),
                signal: controller ? controller.signal : null
            })
            .then(async res => {
                if (timeoutId) clearTimeout(timeoutId);
                const text = await res.text();
                let data;
                try { data = JSON.parse(text); } catch { data = text; }

                if (!res.ok) {
                    const errorMsg = typeof data === 'object' && data.message ? data.message : (typeof data === 'string' ? data : "Registration failed");
                    if (errorMsg.toLowerCase().includes("already registered") || errorMsg.toLowerCase().includes("exists")) {
                        if (DEMO_ACCOUNTS[email]) {
                            saveLocalAndProceed({ ...DEMO_ACCOUNTS[email], name: name || DEMO_ACCOUNTS[email].name, role });
                            return;
                        }
                    }
                    throw new Error(errorMsg);
                }
                return data;
            })
            .then(savedUser => {
                if (!savedUser) return;
                saveLocalAndProceed(savedUser);
            })
            .catch(err => {
                if (timeoutId) clearTimeout(timeoutId);
                console.warn("Backend registration error or timeout:", err);

                if (err.message && err.message.toLowerCase().includes("already registered") && !DEMO_ACCOUNTS[email]) {
                    msg.innerHTML = `<span class="text-danger"><i class="fas fa-exclamation-circle me-1"></i> ${err.message}. Please sign in.</span>`;
                    return;
                }

                const fallbackUser = DEMO_ACCOUNTS[email] ? { ...DEMO_ACCOUNTS[email], name: name || DEMO_ACCOUNTS[email].name, role } : {
                    id: Date.now(),
                    name: name,
                    email: email,
                    role: role || "JOB_SEEKER",
                    password: password
                };

                saveLocalAndProceed(fallbackUser);
            });
        }
    </script>
</body>
</html>
