<!DOCTYPE html>
<html>

<head>
    <title>JobHub - Jobs</title>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="jobs.html">
            JobHub
        </a>

        <div>

            <a class="btn btn-light me-2"
               href="my-applications.html">
                My Applications
            </a>

            <a class="btn btn-light"
               href="login.html">
                Login
            </a>

        </div>

    </div>

</nav>


<!-- Main Content -->
<div class="container mt-4">

    <h2 class="text-center mb-4">
        Find Your Dream Job
    </h2>


    <!-- Search -->
    <input
        type="text"
        id="search"
        class="form-control mb-4"
        placeholder="Search by job title, company or location"
        onkeyup="searchJobs()"
    >


    <!-- Jobs -->
    <div id="jobs" class="row">

        <p class="text-center">
            Loading jobs...
        </p>

    </div>

</div>


<script>

let allJobs = [];


const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://localhost:8080/api" : "https://jobhub-backend.onrender.com/api";
fetch(`${API_BASE}/jobs`)

.then(response => response.json())

.then(data => {

    allJobs = data;

    displayJobs(allJobs);

})

.catch(error => {

    document.getElementById("jobs").innerHTML = `
        <p class="text-danger text-center">
            Unable to load jobs.
        </p>
    `;

});


// Display jobs
function displayJobs(jobs) {

    let output = "";

    if (jobs.length === 0) {

        output = `
            <p class="text-center">
                No jobs found.
            </p>
        `;

    }

    jobs.forEach(job => {

        output += `

        <div class="col-md-4 mb-4">

            <div class="card shadow h-100">

                <div class="card-body">

                    <h4>${job.title}</h4>

                    <h6 class="text-primary">
                        ${job.company}
                    </h6>

                    <p>
                        📍 ${job.location}
                    </p>

                    <p>
                        💰 ${job.salary}
                    </p>

                    <p>
                        💼 ${job.jobType}
                    </p>

                    <p>
                        ${job.description}
                    </p>

                    <button
                        class="btn btn-primary"
                        onclick="viewJob(${job.id})">

                        View Details

                    </button>

                </div>

            </div>

        </div>

        `;

    });

    document.getElementById("jobs").innerHTML = output;
}


// Search jobs
function searchJobs() {

    let search =
        document.getElementById("search")
        .value
        .toLowerCase();

    let filteredJobs = allJobs.filter(job =>

        job.title.toLowerCase().includes(search) ||

        job.company.toLowerCase().includes(search) ||

        job.location.toLowerCase().includes(search)

    );

    displayJobs(filteredJobs);
}


// View job details
function viewJob(id) {

    window.location.href =
        "job-details.html?id=" + id;

}

</script>

</body>

</html>
