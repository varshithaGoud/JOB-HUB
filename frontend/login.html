<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - JobHub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        accent: '#a855f7',
                        darkBg: '#090d16',
                        cardBg: '#0f172a'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #090d16; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .btn-gradient:hover { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-100">

    <!-- Top Navigation -->
    <header class="w-full glass-panel sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                    <i class="fas fa-briefcase"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">Job<span class="text-indigo-400">Hub</span></span>
            </a>
            <div class="flex items-center gap-4">
                <a href="index.html" class="text-sm font-medium text-slate-400 hover:text-white transition">
                    <i class="fas fa-globe mr-1"></i> Job Board
                </a>
                <a href="register.html" class="text-sm font-semibold px-4 py-2 rounded-lg bg-indigo-600/20 hover:bg-indigo-600/30 text-indigo-300 border border-indigo-500/30 transition">
                    <i class="fas fa-user-plus mr-1.5"></i> Register
                </a>
            </div>
        </div>
    </header>

    <!-- Main Login Content -->
    <main class="flex-1 flex items-center justify-center p-4 py-12">
        <div class="w-full max-w-md">
            
            <div class="glass-panel p-8 rounded-2xl shadow-2xl relative overflow-hidden">
                <!-- Background ambient glow -->
                <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-purple-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Tab Header -->
                <div class="flex border-b border-slate-800 mb-6 pb-2">
                    <button id="tabLoginBtn" onclick="switchTab('login')" class="flex-1 text-center py-2 text-sm font-bold border-b-2 border-indigo-500 text-white transition">
                        <i class="fas fa-sign-in-alt mr-1.5"></i> Sign In
                    </button>
                    <button id="tabRegisterBtn" onclick="switchTab('register')" class="flex-1 text-center py-2 text-sm font-medium text-slate-400 hover:text-slate-200 transition">
                        <i class="fas fa-user-plus mr-1.5"></i> Register
                    </button>
                </div>

                <!-- LOGIN FORM -->
                <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                    <div class="text-center mb-4">
                        <h2 class="text-xl font-bold text-white tracking-tight">Welcome Back</h2>
                        <p class="text-xs text-slate-400 mt-1">Sign in to manage your applications and jobs</p>
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="loginEmail" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" id="loginEmail" required placeholder="name@example.com"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="loginPassword" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" id="loginPassword" required placeholder="••••••••"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="btnSubmitLogin"
                        class="w-full btn-gradient py-3 rounded-xl text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 transition duration-200 flex items-center justify-center gap-2 mt-2">
                        <i class="fas fa-sign-in-alt"></i> Sign In to Account
                    </button>

                    <!-- Feedback message -->
                    <div id="loginMessage" class="text-center text-sm min-h-[24px]"></div>

                    <!-- Quick Demo Credentials Box -->
                    <div class="mt-6 pt-5 border-t border-slate-800">
                        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 text-center">Quick Demo Login</p>
                        <div class="grid grid-cols-3 gap-2 text-xs">
                            <button type="button" onclick="fillDemo('alex@seeker.com', 'password')"
                                class="py-2 px-2 bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-center transition">
                                <i class="fas fa-user block text-indigo-400 mb-1"></i> Seeker
                            </button>
                            <button type="button" onclick="fillDemo('techcorp@jobs.com', 'password')"
                                class="py-2 px-2 bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-center transition">
                                <i class="fas fa-building block text-amber-400 mb-1"></i> Recruiter
                            </button>
                            <button type="button" onclick="fillDemo('admin@jobhub.com', 'password')"
                                class="py-2 px-2 bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-lg text-center transition">
                                <i class="fas fa-shield-alt block text-rose-400 mb-1"></i> Admin
                            </button>
                        </div>
                    </div>
                </form>

                <!-- REGISTER FORM TAB -->
                <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                    <div class="text-center mb-4">
                        <h2 class="text-xl font-bold text-white tracking-tight">Create an Account</h2>
                        <p class="text-xs text-slate-400 mt-1">Get started with JobHub in seconds</p>
                    </div>

                    <!-- Full Name -->
                    <div>
                        <label for="regName" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Full Name / Organization</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                                <i class="fas fa-user"></i>
                            </span>
                            <input type="text" id="regName" required placeholder="Alex Johnson or TechCorp"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                        </div>
                    </div>

                    <!-- Email -->
                    <div>
                        <label for="regEmail" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <input type="email" id="regEmail" required placeholder="name@domain.com"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                        </div>
                    </div>

                    <!-- Password -->
                    <div>
                        <label for="regPassword" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
                                <i class="fas fa-lock"></i>
                            </span>
                            <input type="password" id="regPassword" required placeholder="Minimum 6 characters" minlength="6"
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white placeholder-slate-500 text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                        </div>
                    </div>

                    <!-- Role -->
                    <div>
                        <label for="regRole" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">I am registering as:</label>
                        <select id="regRole"
                            class="w-full px-4 py-2.5 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                            <option value="JOB_SEEKER">🧑‍💻 Job Seeker (Search & Apply)</option>
                            <option value="RECRUITER">🏢 Recruiter / Employer (Post Jobs)</option>
                        </select>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="btnSubmitRegister"
                        class="w-full btn-gradient py-3 rounded-xl text-white font-semibold text-sm shadow-lg shadow-indigo-500/25 transition duration-200 flex items-center justify-center gap-2 mt-2">
                        <i class="fas fa-user-plus"></i> Complete Registration
                    </button>

                    <!-- Feedback message -->
                    <div id="registerMessage" class="text-center text-sm min-h-[24px]"></div>
                </form>

                <div class="mt-6 pt-5 border-t border-slate-800 text-center">
                    <p class="text-sm text-slate-400">
                        Need help? <a href="index.html" class="text-indigo-400 hover:text-indigo-300 font-semibold transition ml-1">Return to Job Board</a>
                    </p>
                </div>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full py-4 text-center text-xs text-slate-500 border-t border-slate-800/80">
        &copy; 2026 JobHub Platform. All rights reserved. Connecting Talent with Opportunities.
    </footer>

    <script>
        const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
            ? "http://localhost:8080/api"
            : "https://jobhub-backend.onrender.com/api";

        function switchTab(tab) {
            const loginForm = document.getElementById("loginForm");
            const registerForm = document.getElementById("registerForm");
            const tabLoginBtn = document.getElementById("tabLoginBtn");
            const tabRegisterBtn = document.getElementById("tabRegisterBtn");

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                tabLoginBtn.classList.add('border-b-2', 'border-indigo-500', 'text-white', 'font-bold');
                tabLoginBtn.classList.remove('text-slate-400', 'font-medium');
                tabRegisterBtn.classList.remove('border-b-2', 'border-indigo-500', 'text-white', 'font-bold');
                tabRegisterBtn.classList.add('text-slate-400', 'font-medium');
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                tabRegisterBtn.classList.add('border-b-2', 'border-indigo-500', 'text-white', 'font-bold');
                tabRegisterBtn.classList.remove('text-slate-400', 'font-medium');
                tabLoginBtn.classList.remove('border-b-2', 'border-indigo-500', 'text-white', 'font-bold');
                tabLoginBtn.classList.add('text-slate-400', 'font-medium');
            }
        }

        function fillDemo(email, password) {
            document.getElementById("loginEmail").value = email;
            document.getElementById("loginPassword").value = password;
            switchTab('login');
        }

        const DEMO_ACCOUNTS = {
            "admin@jobhub.com": { id: 1, name: "System Administrator", email: "admin@jobhub.com", role: "ADMIN", password: "password" },
            "techcorp@jobs.com": { id: 2, name: "Sarah Jenkins", email: "techcorp@jobs.com", role: "RECRUITER", password: "password" },
            "nextgen@jobs.com": { id: 3, name: "Marcus Vance", email: "nextgen@jobs.com", role: "RECRUITER", password: "password" },
            "alex@seeker.com": { id: 4, name: "Alex Johnson", email: "alex@seeker.com", role: "JOB_SEEKER", password: "password" },
            "elena@seeker.com": { id: 5, name: "Elena Rostova", email: "elena@seeker.com", role: "JOB_SEEKER", password: "password" }
        };

        window.addEventListener("DOMContentLoaded", () => {
            if (window.location.hash === "#register") {
                switchTab('register');
            }
        });

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById("loginEmail").value.trim().toLowerCase();
            const password = document.getElementById("loginPassword").value;
            const msg = document.getElementById("loginMessage");
            const btn = document.getElementById("btnSubmitLogin");

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Authenticating...`;
            msg.innerHTML = `<span class="text-indigo-400"><i class="fas fa-spinner fa-spin mr-1"></i> Checking credentials...</span>`;

            const localUsers = JSON.parse(localStorage.getItem("registered_users") || "{}");
            const matchedLocalUser = localUsers[email];

            const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
            const timeoutId = controller ? setTimeout(() => controller.abort(), 3500) : null;

            fetch(`${API_BASE}/users/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password }),
                signal: controller ? controller.signal : null
            })
            .then(async res => {
                if (timeoutId) clearTimeout(timeoutId);
                const text = await res.text();
                let data;
                try { data = JSON.parse(text); } catch { data = text; }
                if (!res.ok) throw new Error(typeof data === 'object' && data.message ? data.message : (typeof data === 'string' ? data : "Invalid credentials"));
                return data;
            })
            .then(user => {
                proceedLogin(user);
            })
            .catch(err => {
                if (timeoutId) clearTimeout(timeoutId);
                btn.disabled = false;
                btn.innerHTML = `<i class="fas fa-sign-in-alt mr-2"></i> Sign In to Account`;

                if (matchedLocalUser && (!matchedLocalUser.password || matchedLocalUser.password === password)) {
                    console.warn("Backend unreachable. Using local registered user credentials.");
                    proceedLogin(matchedLocalUser);
                } else if (DEMO_ACCOUNTS[email]) {
                    console.warn("Backend server slow. Using demo credentials fallback.");
                    proceedLogin(DEMO_ACCOUNTS[email]);
                } else {
                    msg.innerHTML = `<span class="text-rose-400"><i class="fas fa-exclamation-circle mr-1"></i> ${err.message || "Invalid email or password."}</span>`;
                }
            });
        }

        function proceedLogin(user) {
            const msg = document.getElementById("loginMessage");
            localStorage.setItem("userId", user.id);
            localStorage.setItem("userName", user.name);
            localStorage.setItem("userEmail", user.email);
            localStorage.setItem("userRole", user.role);

            msg.innerHTML = `<span class="text-emerald-400 font-semibold"><i class="fas fa-check-circle mr-1"></i> Success! Redirecting...</span>`;

            setTimeout(() => {
                if (user.role === "RECRUITER") {
                    window.location.href = "recruiter-dashboard.html";
                } else if (user.role === "ADMIN") {
                    window.location.href = "admin-dashboard.html";
                } else {
                    window.location.href = "index.html";
                }
            }, 500);
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById("regName").value.trim();
            const email = document.getElementById("regEmail").value.trim().toLowerCase();
            const password = document.getElementById("regPassword").value;
            const role = document.getElementById("regRole").value;
            const msg = document.getElementById("registerMessage");
            const btn = document.getElementById("btnSubmitRegister");

            if (!name || !email || !password) {
                msg.innerHTML = `<span class="text-rose-400"><i class="fas fa-exclamation-circle mr-1"></i> Please fill in all fields.</span>`;
                return;
            }

            btn.disabled = true;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Creating account...`;
            msg.innerHTML = `<span class="text-indigo-400"><i class="fas fa-spinner fa-spin mr-1"></i> Creating account...</span>`;

            const saveLocalAndProceed = (userData) => {
                const localUsers = JSON.parse(localStorage.getItem("registered_users") || "{}");
                localUsers[email] = {
                    id: userData.id || Date.now(),
                    name: userData.name || name,
                    email: email,
                    role: userData.role || role || "JOB_SEEKER",
                    password: password
                };
                localStorage.setItem("registered_users", JSON.stringify(localUsers));

                msg.innerHTML = `<span class="text-emerald-400 font-semibold"><i class="fas fa-check-circle mr-1"></i> Account created! Logging you in...</span>`;
                localStorage.setItem("userId", userData.id || Date.now());
                localStorage.setItem("userName", userData.name || name);
                localStorage.setItem("userEmail", email);
                localStorage.setItem("userRole", userData.role || role || "JOB_SEEKER");

                setTimeout(() => {
                    if ((userData.role || role) === "RECRUITER") {
                        window.location.href = "recruiter-dashboard.html";
                    } else if ((userData.role || role) === "ADMIN") {
                        window.location.href = "admin-dashboard.html";
                    } else {
                        window.location.href = "index.html";
                    }
                }, 700);
            };

            const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
            const timeoutId = controller ? setTimeout(() => controller.abort(), 3500) : null;

            fetch(`${API_BASE}/users/register`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name, email, password, role }),
                signal: controller ? controller.signal : null
            })
            .then(async res => {
                if (timeoutId) clearTimeout(timeoutId);
                const text = await res.text();
                let data;
                try { data = JSON.parse(text); } catch { data = text; }

                if (!res.ok) {
                    const errorMsg = typeof data === 'object' && data.message ? data.message : (typeof data === 'string' ? data : "Registration failed");
                    if (errorMsg.toLowerCase().includes("already registered") || errorMsg.toLowerCase().includes("exists")) {
                        if (DEMO_ACCOUNTS[email]) {
                            saveLocalAndProceed({ ...DEMO_ACCOUNTS[email], name: name || DEMO_ACCOUNTS[email].name, role });
                            return;
                        }
                    }
                    throw new Error(errorMsg);
                }
                return data;
            })
            .then(savedUser => {
                if (!savedUser) return;
                saveLocalAndProceed(savedUser);
            })
            .catch(err => {
                if (timeoutId) clearTimeout(timeoutId);
                console.warn("Backend registration error or timeout:", err);

                if (err.message && err.message.toLowerCase().includes("already registered") && !DEMO_ACCOUNTS[email]) {
                    btn.disabled = false;
                    btn.innerHTML = `<i class="fas fa-user-plus mr-2"></i> Complete Registration`;
                    msg.innerHTML = `<span class="text-rose-400"><i class="fas fa-exclamation-circle mr-1"></i> ${err.message}. Please sign in.</span>`;
                    return;
                }

                const fallbackUser = DEMO_ACCOUNTS[email] ? { ...DEMO_ACCOUNTS[email], name: name || DEMO_ACCOUNTS[email].name, role } : {
                    id: Date.now(),
                    name: name,
                    email: email,
                    role: role || "JOB_SEEKER",
                    password: password
                };

                saveLocalAndProceed(fallbackUser);
            });
        }
    </script>
</body>
</html>
