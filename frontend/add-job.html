<!DOCTYPE html>
<html>
<head>
    <title>Add Job - JobHub</title>
</head>
<body>

<h2>Add New Job</h2>

<input id="title" placeholder="Job Title"><br><br>
<input id="company" placeholder="Company"><br><br>
<input id="location" placeholder="Location"><br><br>
<input id="salary" placeholder="Salary"><br><br>
<input id="jobType" placeholder="Job Type"><br><br>

<textarea id="description" placeholder="Job Description"></textarea>
<br><br>

<button onclick="addJob()">Add Job</button>

<p id="result"></p>

<script>
function addJob() {

    const job = {
        title: document.getElementById("title").value,
        company: document.getElementById("company").value,
        location: document.getElementById("location").value,
        salary: document.getElementById("salary").value,
        jobType: document.getElementById("jobType").value,
        description: document.getElementById("description").value
    };

    const API_BASE = "https://jobhub-backend.onrender.com/api";
    fetch(API_BASE + "/jobs", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(job)
    })
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerText =
            "Job added successfully!";
    })
    .catch(error => {
        document.getElementById("result").innerText =
            "Failed to add job!";
    });
}
</script>

</body>
</html>
