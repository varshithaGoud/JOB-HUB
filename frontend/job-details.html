<!DOCTYPE html>
<html>
<head>
    <title>Job Details - JobHub</title>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="jobs.html">JobHub</a>
        <a class="btn btn-light" href="jobs.html">All Jobs</a>
    </div>
</nav>

<div class="container mt-5">

    <div id="job" class="card shadow p-4">
        <p class="text-center">Loading job details...</p>
    </div>

</div>

<script>

const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") ? "http://localhost:8080/api" : "https://jobhub-backend.onrender.com/api";
const id = new URLSearchParams(window.location.search).get("id");

fetch(`${API_BASE}/jobs/` + id)

    .then(response => response.json())

    .then(job => {

        document.getElementById("job").innerHTML = `

            <h2>${job.title}</h2>

            <h5 class="text-primary">${job.company}</h5>

            <hr>

            <p>
                <b>Location:</b> ${job.location}
            </p>

            <p>
                <b>Salary:</b> ${job.salary}
            </p>

            <p>
                <b>Job Type:</b> ${job.jobType}
            </p>

            <p>
                <b>Description:</b>
            </p>

            <p>${job.description}</p>

            <hr>

            <button class="btn btn-success"
                    onclick="applyJob()">
                Apply Now
            </button>

            <a href="jobs.html"
               class="btn btn-secondary">
                Back to Jobs
            </a>
        `;
    })

    .catch(error => {

        document.getElementById("job").innerHTML = `
            <p class="text-danger">
                Unable to load job details.
            </p>
        `;
    });


function applyJob() {
    const userId = localStorage.getItem("userId");
    if (!userId) {
        alert("Please login first!");
        window.location.href = "login.html";
        return;
    }

    const application = {
        id: Date.now(),
        jobId: parseInt(id),
        userId: parseInt(userId),
        status: "PENDING",
        appliedDate: new Date().toISOString().split('T')[0]
    };

    const localApps = JSON.parse(localStorage.getItem("local_applications") || "[]");
    const existingIndex = localApps.findIndex(a => a.jobId == application.jobId && a.userId == application.userId);
    if (existingIndex >= 0) {
        localApps[existingIndex] = { ...localApps[existingIndex], ...application };
    } else {
        localApps.push(application);
    }
    localStorage.setItem("local_applications", JSON.stringify(localApps));

    const controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timeoutId = controller ? setTimeout(() => controller.abort(), 3500) : null;

    fetch(`${API_BASE}/applications`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ jobId: parseInt(id), userId: parseInt(userId) }),
        signal: controller ? controller.signal : null
    })
    .then(async response => {
        if (timeoutId) clearTimeout(timeoutId);
        alert("Application submitted successfully!");
        window.location.href = "my-applications.html";
    })
    .catch(error => {
        if (timeoutId) clearTimeout(timeoutId);
        console.warn("Backend error, application saved locally:", error);
        alert("Application submitted successfully!");
        window.location.href = "my-applications.html";
    });
}

</script>

</body>
</html>
