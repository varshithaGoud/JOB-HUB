<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job - JobHub</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        accent: '#a855f7',
                        darkBg: '#090d16',
                        cardBg: '#0f172a'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #090d16; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .btn-gradient { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); }
        .btn-gradient:hover { background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-slate-100">

    <!-- Top Navigation -->
    <header class="w-full glass-panel sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/25">
                    <i class="fas fa-briefcase"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-white">Job<span class="text-indigo-400">Hub</span></span>
            </a>

            <nav class="flex items-center gap-4 text-sm font-medium text-slate-300">
                <a href="recruiter-dashboard.html" class="hover:text-white transition flex items-center gap-1.5">
                    <i class="fas fa-building text-xs text-amber-400"></i> Recruiter Console
                </a>
                <a href="jobs.html" class="hover:text-white transition flex items-center gap-1.5">
                    <i class="fas fa-search text-xs"></i> All Jobs
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Form Container -->
    <main class="flex-1 max-w-3xl mx-auto px-4 sm:px-6 py-10 w-full">
        <div class="glass-panel p-6 sm:p-10 rounded-3xl border border-slate-800 shadow-2xl">
            <div class="mb-6 pb-4 border-b border-slate-800">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20">
                    Recruiter Opening
                </span>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-white mt-2 mb-1">Create Job Listing</h1>
                <p class="text-xs sm:text-sm text-slate-400">Publish your opening across our network of verified candidates</p>
            </div>

            <form onsubmit="publishJob(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Position Title *</label>
                        <input type="text" id="title" required placeholder="e.g. Lead Software Engineer"
                            class="w-full bg-slate-900/90 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Company Name *</label>
                        <input type="text" id="company" required placeholder="e.g. Acme Tech Labs"
                            class="w-full bg-slate-900/90 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Workplace Location *</label>
                        <input type="text" id="location" required placeholder="e.g. Remote or Seattle, WA"
                            class="w-full bg-slate-900/90 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Salary Range *</label>
                        <input type="text" id="salary" required placeholder="e.g. $135,000 - $160,000"
                            class="w-full bg-slate-900/90 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Employment Type</label>
                        <select id="jobType" class="w-full bg-slate-900/90 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="Full Time">Full Time</option>
                            <option value="Part Time">Part Time</option>
                            <option value="Contract">Contract</option>
                            <option value="Remote">Remote</option>
                            <option value="Internship">Internship</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Category</label>
                        <select id="category" class="w-full bg-slate-900/90 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="Engineering">Engineering</option>
                            <option value="Design">Design</option>
                            <option value="Data & AI">Data & AI</option>
                            <option value="Product">Product</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">Detailed Job Description *</label>
                    <textarea id="description" rows="5" required placeholder="Detail the expectations, responsibilities, and requirements..."
                        class="w-full bg-slate-900/90 border border-slate-800 text-white rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-indigo-500"></textarea>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                    <a href="recruiter-dashboard.html" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition">
                        Cancel
                    </a>
                    <button type="submit" class="btn-gradient px-6 py-2.5 rounded-xl text-xs font-bold text-white shadow-lg shadow-indigo-500/25 transition">
                        Publish Job
                    </button>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full border-t border-slate-800/80 py-8 mt-12 bg-slate-950/40">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-xs text-slate-500">
                &copy; 2026 JobHub Platform &bull; Built with Tailwind CSS & Spring Boot. All rights reserved.
            </p>
        </div>
    </footer>

    <script>
        const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") 
            ? "http://localhost:8080/api" 
            : "https://jobhub-backend.onrender.com/api";

        function publishJob(e) {
            e.preventDefault();
            const userId = localStorage.getItem("userId") || "2";

            const job = {
                id: Date.now(),
                title: document.getElementById("title").value.trim(),
                company: document.getElementById("company").value.trim(),
                location: document.getElementById("location").value.trim(),
                salary: document.getElementById("salary").value.trim(),
                jobType: document.getElementById("jobType").value,
                category: document.getElementById("category").value,
                description: document.getElementById("description").value.trim(),
                recruiterId: parseInt(userId)
            };

            const localJobs = JSON.parse(localStorage.getItem("local_jobs") || "[]");
            localJobs.push(job);
            localStorage.setItem("local_jobs", JSON.stringify(localJobs));

            fetch(API_BASE + "/jobs", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(job)
            }).catch(() => {});

            alert("Job published successfully!");
            window.location.href = "jobs.html";
        }
    </script>
</body>
</html>
