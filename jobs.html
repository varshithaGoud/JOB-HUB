<!DOCTYPE html>
<html>
<head>
<title>JobHub - Jobs</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary"><div class="container"><a class="navbar-brand" href="jobs.html">JobHub</a>
<div><a class="btn btn-light me-2" href="my-applications.html">My Applications</a><button class="btn btn-warning" onclick="logout()">Logout</button></div></div></nav>
<div class="container mt-4"><h2 class="text-center mb-4">Find Your Dream Job</h2>
<input id="search" class="form-control mb-4" placeholder="Search by job title, company or location" onkeyup="searchJobs()">
<div id="jobs" class="row"><p class="text-center">Loading jobs...</p></div></div>
<script>
let allJobs=[];
fetch("http://localhost:8080/api/jobs").then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{allJobs=d;displayJobs(d)}).catch(()=>jobs.innerHTML="<p class='text-danger text-center'>Unable to load jobs. Start backend.</p>");
function displayJobs(list){let o="";if(!list.length)o="<p class='text-center'>No jobs found.</p>";list.forEach(j=>o+=`<div class="col-md-4 mb-4"><div class="card shadow h-100"><div class="card-body">
<h4>${esc(j.title)}</h4><h6 class="text-primary">${esc(j.company)}</h6><p>📍 ${esc(j.location)}</p><p>💰 ${esc(j.salary)}</p><p>💼 ${esc(j.jobType)}</p><p>${esc(j.description||"")}</p>
<button class="btn btn-primary" onclick="viewJob(${j.id})">View Details</button></div></div></div>`);jobs.innerHTML=o}
function searchJobs(){let s=search.value.toLowerCase();displayJobs(allJobs.filter(j=>(j.title||"").toLowerCase().includes(s)||(j.company||"").toLowerCase().includes(s)||(j.location||"").toLowerCase().includes(s)))}
function viewJob(id){location.href="job-details.html?id="+id} function logout(){localStorage.clear();location.href="login.html"}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
</script></body></html>
